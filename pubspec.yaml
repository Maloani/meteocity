name: meteocity
description: "Application Flutter professionnelle permettant d’obtenir les prévisions météorologiques actuelles et sur 5 jours via l’API OpenWeather."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icônes iOS
  cupertino_icons: ^1.0.8

  # Requêtes HTTP (API OpenWeather – version moderne)
  http: ^1.1.0

  # Formatage des dates (jours de la semaine)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Génération automatique des icônes de l’application
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/meteocity_icon.png"
  min_sdk_android: 21
